[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
markers = [
    "integration: requires PostgreSQL (DATABASE_URL)",
    "live: calls the real Gemini API; manual only",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "worker", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
